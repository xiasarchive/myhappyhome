    <style>
        body {
            touch-action: none;

            border: 0 none;
            padding: 0;

            /* change the built in browser progress color */

                accent-color: white; /* #1C77DB  */
            }


        #canvas {
            display: block;
            margin: 0;

            display: none;
            margin: 0 auto;

        #loading:hover, #loadingImage:hover{
            cursor: wait;
        }


        #loading {
            position: absolute;
            display: flex;
            flex-direction: column;

            justify-content: center;

<body>

    <div id="loading">
        <img id="loadingImage" src="loading.png">
        <div id="status">

    <script src="WTMHP.js"></script>
    <script>
        const statusOverlay = document.getElementById('status');
        const statusProgress = document.getElementById('status-progress');
        const loadingImage = document.getElementById('loadingImage');


            loadingImage.style.display = 'none'


        // This swaps the CLICKME image with the LOADING image when user clicks
            statusProgress.style.display = 'block';
            loadingImage.style.display = 'block'
            loadGame();


        function loadGame(elem) {
            // Force fullscreen - comment out if(){} statement if you dont want fullscreen
            elem = elem || document.documentElement;
            // if (!document.fullscreenElement && !document.mozFullScreenElement &&
            //  !document.webkitFullscreenElement && !document.msFullscreenElement) {
            //  if (elem.requestFullscreen) {
            //      elem.requestFullscreen();
            //  } else if (elem.msRequestFullscreen) {
            //      elem.msRequestFullscreen();
            //  } else if (elem.mozRequestFullScreen) {
            //      elem.mozRequestFullScreen();
            //  } else if (elem.webkitRequestFullscreen) {
            //      elem.webkitRequestFullscreen(Element.ALLOW_KEYBOARD_INPUT);
            //  }
            //}


            var engine = new Engine({"args":[],"canvasResizePolicy":1,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"WTMHP","experimentalVK":false,"fileSizes":{"WTMHP.pck":19505420,"WTMHP.wasm":37900721},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4});
            engine.startGame({
                'onProgress': function (current, total) {
                    if (current > 0 && total > 0) {
                        statusProgress.value = current;
                        statusProgress.max = total;
                        //console.log('Loaded ' + current + ' of ' + total);
                    } else {
                        statusProgress.removeAttribute('value');
                        statusProgress.removeAttribute('max');
                    }
                },
            }).then(() => {
                // Happens when Godot engine has started, so remove progress bar
                statusOverlay.remove();
                loadingImage.remove();
                console.log('Engine has started!');
            });;
        }
    </script>
